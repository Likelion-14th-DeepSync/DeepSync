spring:
  datasource:
    url: jdbc:h2:mem:deepsync;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

jwt:
  secret: test-secret-key-that-is-longer-than-thirty-two-bytes
  access-token-expiration-seconds: 3600
