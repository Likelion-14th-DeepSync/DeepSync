spring:
  application:
    name: wellness
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/deepsync?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:deepsync}
    password: ${DB_PASSWORD:deepsync}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

storage:
  skin-image:
    directory: ${SKIN_IMAGE_STORAGE_DIRECTORY:uploads/skin-images}
    max-size-bytes: ${SKIN_IMAGE_MAX_SIZE_BYTES:10485760}

image-quality:
  passed-score: ${IMAGE_QUALITY_PASSED_SCORE:75}
  rejected-score: ${IMAGE_QUALITY_REJECTED_SCORE:40}

jwt:
  secret: ${JWT_SECRET:local-development-secret-key-must-be-at-least-32-bytes}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
