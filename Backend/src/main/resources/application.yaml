spring:
  application:
    name: wellness
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/deepsync?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:deepsync}
    password: ${DB_PASSWORD:deepsync}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
